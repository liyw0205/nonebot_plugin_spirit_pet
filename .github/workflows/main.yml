name: CI and Release

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Check shell entrypoints
        run: bash -n scripts/install.sh scripts/xiupet.sh

  install-smoke:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      SPIRIT_PET_SKIP_SYSTEM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install from checkout
        run: bash scripts/install.sh --directory "$RUNNER_TEMP/spirit pet" --yes --no-start
      - name: Verify isolated runtime
        run: |
          "$RUNNER_TEMP/spirit pet/.venv/bin/python" "$RUNNER_TEMP/spirit pet/scripts/smoke_test.py"
      - name: Verify manager command
        run: |
          test -x "$HOME/.local/bin/xiupet"
          "$HOME/.local/bin/xiupet" status || test "$?" -eq 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, install-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
