name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - run: python -m pytest -q
      - run: python -m compileall -q src tests scripts
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install With Linux Entry
        if: runner.os == 'Linux'
        run: SPIRIT_PET_SKIP_SYSTEM=1 bash scripts/install.sh --directory "$RUNNER_TEMP/spirit pet install" --yes --no-start
      - name: Install With Windows Entry
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install.ps1 -Directory "$env:RUNNER_TEMP\spirit pet install" -Yes -NoStart -SkipSystem
      - name: Verify Installed Linux Runtime
        if: runner.os == 'Linux'
        run: '"$RUNNER_TEMP/spirit pet install/.venv/bin/python" "$RUNNER_TEMP/spirit pet install/scripts/smoke_test.py"'
      - name: Verify Linux Management Command
        if: runner.os == 'Linux'
        run: |
          test -x "$HOME/.local/bin/xiupet"
          "$HOME/.local/bin/xiupet" status || test $? -eq 1
      - name: Verify Installed Windows Runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:RUNNER_TEMP\spirit pet install\.venv\Scripts\python.exe" "$env:RUNNER_TEMP\spirit pet install\scripts\smoke_test.py"'
      - name: Verify Windows Management Command
        if: runner.os == 'Windows'
        shell: pwsh
        run: 'if (-not (Test-Path "$HOME\bin\xiupet.cmd")) { throw "xiupet command was not generated" }'
