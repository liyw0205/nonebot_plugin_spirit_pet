[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-spirit-pet"
version = "0.1.0"
description = "NoneBot2 灵宠养成与修仙游戏插件，支持 OneBot V11 和 QQ 官方机器人"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10, <4.0"
keywords = ["nonebot2", "nonebot-plugin", "game", "spirit-pet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: NoneBot",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "nonebot2[fastapi]>=2.4.4",
    "nonebot2[httpx]>=2.4.4",
    "nonebot2[websockets]>=2.4.4",
    "nonebot2[aiohttp]>=2.4.4",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-adapter-qq>=1.7.1",
    "pydantic>=2.10,<3",
]
[project.urls]
Homepage = "https://github.com/liyw0205/nonebot_plugin_spirit_pet"

[tool.setuptools]
package-dir = {"" = "src/plugins"}

[tool.setuptools.packages.find]
where = ["src/plugins"]
include = ["nonebot_plugin_spirit_pet*"]

[tool.setuptools.package-data]
nonebot_plugin_spirit_pet = ["data/*.json", "storage/schema.sql"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.nonebot]
plugin_dirs = ["src/plugins"]
builtin_plugins = []

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
]
"@local" = []
nonebot-adapter-qq = [{ name = "QQ", module_name = "nonebot.adapters.qq" }]

[tool.nonebot.plugins]
"@local" = []

[tool.pytest.ini_options]
testpaths = ["tests"]
